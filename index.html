<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor de Capítulos Markdown</title>
  <!-- Biblioteca para converter Markdown para HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-body: #fbfbfa;
      --bg-sidebar: #f5f5f7;
      --border-color: #e5e5ea;
      --text-main: #242426;
      --text-muted: #6e6e73;
      --accent: #1d6fee;
      --accent-soft: #eaf2fd;
      --sidebar-width: 280px;
      --header-mobile-height: 56px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Barra Superior Mobile (Oculta em Desktop) */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-mobile-height);
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 1000;
    }

    .mobile-header span {
      font-weight: 600;
      font-size: 1rem;
    }

    .menu-toggle-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--text-main);
      padding: 8px;
      min-height: 44px;
      min-width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Layout Principal */
    .layout-container {
      display: flex;
      min-height: 100vh;
    }

    /* Fundo escurecido no mobile quando o menu está aberto */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 900;
    }

    /* Barra Lateral de Navegação */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      padding: 24px 16px;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 950;
      transition: transform 0.3s ease;
    }

    .sidebar h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 20px;
      padding-left: 8px;
      color: #111;
      letter-spacing: -0.3px;
    }

    .nav-group {
      margin-bottom: 20px;
    }

    .nav-group-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 6px 8px;
    }

    .nav-list {
      list-style: none;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      transition: background 0.15s ease, color 0.15s ease;
      cursor: pointer;
      touch-action: manipulation;
    }

    .nav-item a:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .nav-item.active a {
      background-color: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    /* Sub-capítulos com recuo */
    .nav-item.sub-item a {
      padding-left: 24px;
      font-size: 0.88rem;
      color: #444;
    }

    /* Área de Leitura */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 48px 32px 80px 32px;
      overflow-y: auto;
      width: 100%;
    }

    .reading-container {
      width: 100%;
      max-width: 720px;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 1.12rem;
      line-height: 1.8;
      color: #222;
      word-wrap: break-word;
    }

    /* Estilos do Markdown Renderizado */
    .reading-container h1 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 24px;
      color: #111;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .reading-container h2 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 36px;
      margin-bottom: 16px;
      color: #1a1a1a;
    }

    .reading-container h3 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      margin-top: 28px;
      margin-bottom: 12px;
    }

    .reading-container p {
      margin-bottom: 1.4em;
    }

    .reading-container blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 16px;
      margin: 24px 0;
      font-style: italic;
      color: #555;
    }

    .reading-container ul, .reading-container ol {
      margin: 18px 0;
      padding-left: 28px;
    }

    .reading-container li {
      margin-bottom: 8px;
    }

    .reading-container pre {
      background: #f0f0f3;
      padding: 16px;
      border-radius: 6px;
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 0.95rem;
      overflow-x: auto;
      margin: 20px 0;
    }

    .reading-container code {
      background: #f0f0f3;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.9em;
    }

    .reading-container pre code {
      background: transparent;
      padding: 0;
    }

    .reading-container img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 20px 0;
      display: block;
    }

    .loading {
      color: var(--text-muted);
      font-family: sans-serif;
      font-style: italic;
    }

    /* --- REGRAS RESPONSIVAS (MOBILE & TABLET) --- */
    @media (max-width: 768px) {
      .mobile-header {
        display: flex;
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        height: 100vh;
        box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .overlay.active {
        display: block;
      }

      .main-content {
        padding: calc(var(--header-mobile-height) + 24px) 20px 60px 20px;
      }

      .reading-container {
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .reading-container h1 {
        font-size: 1.75rem;
      }

      .reading-container h2 {
        font-size: 1.35rem;
      }

      .nav-item a {
        min-height: 44px; /* Otimizado para toque */
      }
    }
  </style>
</head>
<body>

  <!-- Barra Superior no Mobile -->
  <header class="mobile-header">
    <span>Índice</span>
    <button class="menu-toggle-btn" aria-label="Abrir Menu" onclick="toggleMenu()">☰</button>
  </header>

  <!-- Camada escura de fundo (fechar menu ao clicar) -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <div class="layout-container">
    <!-- MENU DE NAVEGAÇÃO -->
    <nav class="sidebar" id="sidebar">
      <h2>Índice</h2>
      
      <div class="nav-group">
        <div class="nav-group-title">Primeiro Pilar - Deus</div>
        <ul class="nav-list">
          <li class="nav-item active">
            <a onclick="carregarCapitulo('capitulo-1.md', this)">1. Introdução</a>
          </li>
          <li class="nav-item sub-item">
            <a onclick="carregarCapitulo('capitulo-1-1.md', this)">1.1 O Começo de Tudo</a>
          </li>
          <li class="nav-item sub-item">
            <a onclick="carregarCapitulo('capitulo-1-2.md', this)">1.2 Primeiros Passos</a>
          </li>
        </ul>
      </div>

      <div class="nav-group">
        <div class="nav-group-title">Segundo Pilar - Bíblia</div>
        <ul class="nav-list">
          <li class="nav-item">
            <a onclick="carregarCapitulo('capitulo-2.md', this)">2. Desenvolvimento</a>
          </li>
          <li class="nav-item sub-item">
            <a onclick="carregarCapitulo('capitulo-2-1.md', this)">2.1 Estratégias</a>
          </li>
        </ul>
      </div>

      <div class="nav-group">
        <div class="nav-group-title">Terceiro Pilar - Religião</div>
        <ul class="nav-list">
          <li class="nav-item">
            <a onclick="carregarCapitulo('capitulo-3.md', this)">3. Conclusão</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- ÁREA DE LEITURA (CONTEÚDO DO MARKDOWN) -->
    <main class="main-content">
      <article id="conteudo-leitura" class="reading-container">
        <!-- O texto Markdown renderizado entrará aqui automaticamente -->
      </article>
    </main>
  </div>

  <script>
    // Controlo do Menu Móvel (Abrir/Fechar)
    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    // Função para carregar e converter o ficheiro Markdown
    async function carregarCapitulo(ficheiroMd, elementoClicado) {
      const contentDiv = document.getElementById('conteudo-leitura');
      contentDiv.innerHTML = '<p class="loading">A carregar capítulo...</p>';

      // Atualizar classe 'active'
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      if (elementoClicado) {
        elementoClicado.closest('.nav-item').classList.add('active');
      }

      // No mobile, fecha o menu após selecionar um capítulo
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      if (sidebar.classList.contains('open')) {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
      }

      try {
        const response = await fetch(ficheiroMd);
        if (!response.ok) {
          throw new Error(`Erro ${response.status}`);
        }
        const markdownTexto = await response.text();
        
        // Converte Markdown -> HTML
        contentDiv.innerHTML = marked.parse(markdownTexto);
        
        // Rola até ao topo
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (erro) {
        contentDiv.innerHTML = `
          <h1>Erro ao carregar</h1>
          <p>Não foi possível encontrar ou ler o ficheiro <code>${ficheiroMd}</code>.</p>
          <p style="font-size:0.95rem; color:#666;">
            Verifique se o nome do ficheiro está correto e se o ficheiro se encontra na raiz do repositório no GitHub Pages.
          </p>
        `;
      }
    }

    // Carrega o primeiro capítulo automaticamente ao entrar
    window.addEventListener('DOMContentLoaded', () => {
      carregarCapitulo('capitulo-1.md', document.querySelector('.nav-item.active a'));
    });
  </script>
</body>
</html>
